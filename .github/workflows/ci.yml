name: Cryptographic Security & Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install || true
      - name: Verify Documentation & Integrity
        run: |
          test -f README.md
          test -f PRD.md
          test -f TODO.md
          test -f LICENSE
